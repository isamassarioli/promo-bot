services:
  promo-bot:
    build: .
    container_name: promo-bot
    restart: unless-stopped
    tty: true
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./config.json:/app/config.json
      - ./data:/app/data

  # Modo teste: lê os feeds e mostra as mensagens no terminal, sem WhatsApp.
  # docker compose run --rm teste
  teste:
    build: .
    profiles: ["teste"]
    command: ["node", "src/index.js", "--dry-run"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config.json:/app/config.json
